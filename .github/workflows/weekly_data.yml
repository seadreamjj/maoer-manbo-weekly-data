name: Weekly Drama Data

on:
  schedule:
    # 每周五北京时间 04:00
    # UTC = 周四 20:00
    - cron: '7 19 * * 4'

  # GitHub Actions 页面手动运行
  workflow_dispatch:


# ============================================================
# 默认权限
# ============================================================

permissions:
  contents: write


jobs:

  # ==========================================================
  # 🐱 Job 1：猫耳
  # ==========================================================

  maoer:
    name: 🐱 Maoer
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------------
      # Checkout
      # --------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # --------------------------------------------------------
      # Python
      # --------------------------------------------------------

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'


      # --------------------------------------------------------
      # 安装依赖
      # --------------------------------------------------------

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      # --------------------------------------------------------
      # 抓取猫耳
      # --------------------------------------------------------

      - name: Fetch Maoer
        env:
          MISSEVAN_COOKIE: ${{ secrets.MISSEVAN_COOKIE }}
        run: |
          python scripts/fetch_maoer.py


      # --------------------------------------------------------
      # 比较猫耳
      # --------------------------------------------------------

      - name: Compare Maoer
        run: |
          python scripts/compare_maoer.py


      # --------------------------------------------------------
      # 检查输出
      # --------------------------------------------------------

      - name: Check Maoer output
        run: |
          echo "===== Maoer output ====="
          ls -lh output/
          echo "========================"


      # --------------------------------------------------------
      # 上传猫耳数据
      #
      # 即使后面的 Manbo Job 失败，
      # Maoer 已经成功的数据仍然可以交给 Commit Job。
      # --------------------------------------------------------

      - name: Upload Maoer data
        uses: actions/upload-artifact@v4
        with:
          name: maoer-output
          path: output/
          if-no-files-found: warn


  # ==========================================================
  # 🎙️ Job 2：漫播
  # ==========================================================

  manbo:
    name: 🎙️ Manbo
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------------
      # Checkout
      # --------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # --------------------------------------------------------
      # Python
      # --------------------------------------------------------

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'


      # --------------------------------------------------------
      # 安装依赖
      # --------------------------------------------------------

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      # --------------------------------------------------------
      # 抓取漫播
      # --------------------------------------------------------

      - name: Fetch Manbo
        run: |
          python scripts/fetch_manbo.py


      # --------------------------------------------------------
      # 比较漫播
      # --------------------------------------------------------

      - name: Compare Manbo
        run: |
          python scripts/compare_manbo.py


      # --------------------------------------------------------
      # 检查输出
      # --------------------------------------------------------

      - name: Check Manbo output
        run: |
          echo "===== Manbo output ====="
          ls -lh output/
          echo "========================"


      # --------------------------------------------------------
      # 上传漫播数据
      # --------------------------------------------------------

      - name: Upload Manbo data
        uses: actions/upload-artifact@v4
        with:
          name: manbo-output
          path: output/
          if-no-files-found: warn


  # ==========================================================
  # 📦 Job 3：统一提交
  #
  # 即使 Maoer / Manbo 任意一个失败，
  # 这个 Job 仍然执行。
  # ==========================================================

  commit:
    name: 📦 Commit weekly data
    runs-on: ubuntu-latest

    # ----------------------------------------------------------
    # 等待两个平台 Job
    #
    # 注意：
    # 即使 maoer 或 manbo 失败，
    # if: always() 仍然让这个 Job 执行。
    # ----------------------------------------------------------

    needs:
      - maoer
      - manbo

    if: always()


    steps:

      # --------------------------------------------------------
      # Checkout 最新仓库
      # --------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # --------------------------------------------------------
      # 下载猫耳数据
      #
      # continue-on-error 是为了：
      # 如果猫耳 Job 完全失败，没有 artifact，
      # 也不要阻止漫播数据提交。
      # --------------------------------------------------------

      - name: Download Maoer data
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: maoer-output
          path: output/


      # --------------------------------------------------------
      # 下载漫播数据
      # --------------------------------------------------------

      - name: Download Manbo data
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: manbo-output
          path: output/


      # --------------------------------------------------------
      # 查看最终 output
      # --------------------------------------------------------

      - name: Check final output
        run: |
          echo "========================================"
          echo "Final output directory"
          echo "========================================"

          if [ -d output ]; then
            ls -lah output/
          else
            echo "output directory does not exist"
          fi

          echo "========================================"


      # --------------------------------------------------------
      # 提交所有成功生成的数据
      # --------------------------------------------------------

      - name: Commit weekly data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add output

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update weekly drama data $(date -u '+%Y-%m-%d')"
            git push
          fi
