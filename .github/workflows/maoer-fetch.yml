name: Weekly Maoer Data

on:
  workflow_dispatch:

  repository_dispatch:
    types:
      - maoer-fetch

permissions:
  contents: write

concurrency:
  group: maoer-fetch
  cancel-in-progress: false

jobs:
  fetch-maoer:
    name: 抓取猫耳周数据
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Run Maoer fetch
        env:
          MISSEVAN_COOKIE: ${{ secrets.MISSEVAN_COOKIE }}
        run: |
          python scripts/fetch_maoer.py

      - name: Commit Maoer data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/ output/

          if git diff --cached --quiet; then
            echo "没有新的猫耳数据需要提交"
          else
            git commit -m "data: update maoer weekly data"
            git pull --rebase origin main
            git push
          fi
